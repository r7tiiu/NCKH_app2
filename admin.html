<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị kết quả khảo sát</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f7fa; color: #222; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  h1 { margin-top: 0; }
  .gate { max-width: 360px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  .gate input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
  button { padding: 10px 16px; border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; font-weight: 600; }
  button:hover { background: #1d4ed8; }
  button.ghost { background: #e5e7eb; color: #222; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 12px; margin: 16px 0 24px; }
  .card { background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .card .label { font-size: 12px; color: #6b7280; text-transform: uppercase; }
  .card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
  th { background: #f9fafb; font-weight: 600; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #fef3c7; color: #92400e; font-size: 12px; font-weight: 600; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Màn hình nhập mật khẩu -->
<div id="gate" class="gate">
  <h2>🔒 Đăng nhập quản trị</h2>
  <input id="pw" type="password" placeholder="Nhập mật khẩu..." />
  <button onclick="login()">Đăng nhập</button>
  <p id="gateMsg" style="color:#dc2626;font-size:14px;"></p>
</div>

<!-- Màn hình chính -->
<div id="main" class="container hidden">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h1>📊 Kết quả khảo sát</h1>
    <button class="ghost" onclick="logout()">Đăng xuất</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <button onclick="loadData()">🔄 Tải lại</button>
    <button onclick="exportCSV()">⬇️ Xuất CSV</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Thời gian</th>
        <th>Stress tổng</th>
        <th>Lĩnh vực cao nhất</th>
        <th id="domainsHeader"></th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <p id="empty" class="hidden" style="text-align:center;color:#6b7280;padding:24px;">Chưa có dữ liệu.</p>
</div>

<script>
let currentPassword = '';
let allResults = [];

function login() {
  const pw = document.getElementById('pw').value.trim();
  if (!pw) return;
  currentPassword = pw;
  loadData().then(ok => {
    if (ok) {
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('main').classList.remove('hidden');
    } else {
      document.getElementById('gateMsg').textContent = 'Sai mật khẩu hoặc lỗi kết nối.';
    }
  });
}

function logout() {
  currentPassword = '';
  allResults = [];
  document.getElementById('main').classList.add('hidden');
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('pw').value = '';
  document.getElementById('gateMsg').textContent = '';
}

async function loadData() {
  try {
    const res = await fetch('/api/results?password=' + encodeURIComponent(currentPassword), {
      cache: 'no-store'
    });
    if (!res.ok) return false;
    const data = await res.json();
    allResults = data.results || [];
    render();
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

function render() {
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  tbody.innerHTML = '';

  if (allResults.length === 0) {
    empty.classList.remove('hidden');
    document.getElementById('stats').innerHTML = '';
    return;
  }
  empty.classList.add('hidden');

  // Lấy danh sách lĩnh vực từ bản ghi đầu tiên
  const domainNames = Object.keys(allResults[0].domains || {});

  // Header cột lĩnh vực
  document.getElementById('domainsHeader').outerHTML =
    domainNames.map(d => `<th>${d}</th>`).join('');

  // Tính stats
  const avgStress = (allResults.reduce((s,r) => s + r.overallStress, 0) / allResults.length).toFixed(1);
  const highestCount = {};
  allResults.forEach(r => {
    if (r.highestDomain) highestCount[r.highestDomain] = (highestCount[r.highestDomain] || 0) + 1;
  });
  const topDomain = Object.entries(highestCount).sort((a,b) => b[1]-a[1])[0];

  document.getElementById('stats').innerHTML = `
    <div class="card"><div class="label">Tổng số người</div><div class="value">${allResults.length}</div></div>
    <div class="card"><div class="label">Stress trung bình</div><div class="value">${avgStress}</div></div>
    <div class="card"><div class="label">Lĩnh vực cao nhất phổ biến</div><div class="value" style="font-size:16px">${topDomain ? topDomain[0] + ' (' + topDomain[1] + ')' : '—'}</div></div>
  `;

  // Render rows
  allResults.forEach((r, i) => {
    const tr = document.createElement('tr');
    const date = new Date(r.timestamp).toLocaleString('vi-VN');
    const domainCells = domainNames.map(d => {
      const v = r.domains[d];
      const isMax = d === r.highestDomain;
      return `<td>${isMax ? `<span class="badge">${v}</span>` : v}</td>`;
    }).join('');
        tr.innerHTML = `
      <td>${i + 1}</td>
      <td>${date}</td>
      <td><strong>${r.overallStress}</strong></td>
      <td>${r.highestDomain || '—'}</td>
      ${domainCells}
      <td><button class="delete-btn" onclick="deleteResult('${r.id}')">🗑️ Xóa</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function exportCSV() {
  if (allResults.length === 0) return alert('Không có dữ liệu');
  const domainNames = Object.keys(allResults[0].domains || {});
  const headers = ['STT', 'Thời gian', 'Stress tổng', 'Lĩnh vực cao nhất', ...domainNames];
  const rows = allResults.map((r, i) => [
    i + 1,
    new Date(r.timestamp).toLocaleString('vi-VN'),
    r.overallStress,
    r.highestDomain || '',
    ...domainNames.map(d => r.domains[d] ?? '')
  ]);

  const csv = [headers, ...rows]
    .map(row => row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(','))
    .join('\n');

  // BOM để Excel đọc đúng tiếng Việt
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ket-qua-khao-sat-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

 async function deleteResult(id) {
  if (!confirm('Bạn có chắc muốn xóa kết quả này không?')) return;
  try {
    const res = await fetch('/api/results?password=' + encodeURIComponent(currentPassword) + '&id=' + id, {
      method: 'DELETE'
    });
    if (res.ok) {
      alert('Đã xóa thành công!');
      loadData(); // Tải lại bảng
    } else {
      alert('Lỗi khi xóa!');
    }
  } catch (e) {
    console.error(e);
    alert('Lỗi kết nối!');
  }
}

// Cho phép Enter ở ô mật khẩu
document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
